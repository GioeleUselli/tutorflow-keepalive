name: Keep TutorFlow awake

on:
  schedule:
    # Ogni 5 minuti. GitHub può ritardare di qualche minuto nei momenti di carico.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

env:
  APP_URL: https://tutor-flow-cwfverfpb9b3bub0.italynorth-01.azurewebsites.net

jobs:
  ping:
    name: Ping health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake the app
        run: |
          curl --silent --show-error \
               --max-time 25 \
               --retry 3 --retry-delay 5 \
               --write-out 'HTTP %{http_code} in %{time_total}s\n' \
               "${APP_URL}/health"
